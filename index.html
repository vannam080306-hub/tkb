<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thời khóa biểu của tôi</title>
  <style>
    :root { --ink:#172033; --muted:#667085; --line:#e6eaf0; --surface:#fff; --blue:#3867f4; --bg:#f5f7fb; }
    * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; }
    header { color:white; background:linear-gradient(120deg,#315df5,#7b4df5); padding:34px max(20px,calc((100% - 1180px)/2)); }
    h1 { margin:0; font-size:clamp(1.7rem,4vw,2.45rem) } header p { margin:7px 0 0; opacity:.9 }
    main { max-width:1180px; margin:24px auto; padding:0 20px 42px; } .toolbar,.card { background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:0 7px 22px #15234b0a; }
    .toolbar { display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; padding:14px; margin-bottom:18px; } .actions { display:flex; flex-wrap:wrap; gap:9px; }
    button { border:0; border-radius:9px; padding:10px 14px; font:inherit; font-weight:650; color:white; background:var(--blue); cursor:pointer; } button:hover { filter:brightness(.95) } button.secondary { background:#eef2ff; color:#3558ce } button.danger { background:#fff1f1; color:#c23b45 }
    .card { overflow:auto } table { width:100%; min-width:760px; border-collapse:collapse; table-layout:fixed } th,td { padding:11px 9px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top } th { background:#f9fafc; color:#4c596d; font-size:.83rem; } th:first-child,td:first-child { width:165px; } tr:last-child td { border-bottom:0 }
    .time-input { width:100%; padding:8px; border:1px solid #d9dfeb; border-radius:7px; font:inherit; color:var(--ink); background:#fff; } .cell { min-height:74px; border-radius:10px; padding:8px; position:relative; cursor:pointer; color:#172033; font-size:.86rem; overflow-wrap:anywhere; } .cell:hover { outline:2px solid #b9c8ff } .cell.empty { color:#98a2b3; background:#f8fafc; display:grid; place-items:center; }
    .cell strong { display:block; font-size:.95rem; padding-right:23px } .cell small { display:block; margin-top:4px; opacity:.78; line-height:1.35 } .cell .delete { position:absolute; top:6px; right:6px; width:21px; height:21px; border-radius:50%; padding:0; display:grid; place-items:center; background:#ffffffa8; color:#535d6d; font-size:14px; }
    dialog { width:min(480px,calc(100% - 30px)); border:0; border-radius:16px; padding:0; box-shadow:0 18px 50px #11182755; } dialog::backdrop { background:#11182780; } form { padding:22px; } dialog h2 { margin:0 0 16px; } label { display:block; color:#475467; font-size:.87rem; font-weight:650; margin:11px 0 5px } input,textarea,select { width:100%; border:1px solid #d6dce8; border-radius:8px; padding:10px; font:inherit; } textarea { resize:vertical; min-height:70px; } .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .form-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:19px; } .hint { color:var(--muted); font-size:.85rem; margin:4px 0 0; }
    .week-navigation { display:flex; align-items:center; gap:8px; } .week-navigation button { min-width:40px; padding:9px 12px; } #weekPicker { width:auto; min-width:155px; border:1px solid #d6dce8; border-radius:8px; padding:9px; font:inherit; color:var(--ink); background:#fff; } .cell .occurrence { font-size:.72rem; font-weight:700; opacity:.72; }
    footer { color:var(--muted); font-size:.83rem; margin-top:13px; text-align:center } @media(max-width:600px) { main { padding:0 12px 30px; margin-top:12px } header { padding:24px 16px } .form-grid { grid-template-columns:1fr } .week-navigation { order:3; width:100%; justify-content:center; } #weekPicker { flex:1; } }
    @media print { body { background:#fff } header { background:#fff!important; color:#111; padding:0 0 18px } main { max-width:none; margin:0; padding:0 } .toolbar,footer,.delete { display:none!important } .card { border:0; box-shadow:none } .cell { print-color-adjust:exact; -webkit-print-color-adjust:exact } }
  </style>
</head>
<body>
  <header><h1>Thời khóa biểu của tôi</h1><p>Nhấn vào một ô trống để thêm môn học. Bạn có thể sửa trực tiếp thời gian của từng hàng.</p></header>
  <main>
    <section class="toolbar"><div class="actions"><button id="addRow" class="secondary">+ Thêm khung giờ</button><button id="reset" class="danger">Khôi phục mẫu</button></div><div class="week-navigation"><button id="prevWeek" class="secondary" aria-label="Tuần trước" title="Tuần trước">‹</button><input id="weekPicker" type="date" aria-label="Chọn ngày trong tuần"><button id="nextWeek" class="secondary" aria-label="Tuần sau" title="Tuần sau">›</button></div><div class="actions"><button id="print" class="secondary">In / Xuất PDF</button><button id="addMakeup" class="secondary">+ Dạy bù</button><button id="addSubject">+ Thêm môn học</button></div></section>
    <section class="card"><table><thead><tr><th>Thời gian</th><th id="day-0">Thứ Hai</th><th id="day-1">Thứ Ba</th><th id="day-2">Thứ Tư</th><th id="day-3">Thứ Năm</th><th id="day-4">Thứ Sáu</th><th id="day-5">Thứ Bảy</th><th id="day-6">Chủ Nhật</th></tr></thead><tbody id="schedule"></tbody></table></section>
    <footer>Dữ liệu được lưu tự động trên thiết bị này.</footer>
  </main>
  <dialog id="editor"><form method="dialog"><h2 id="modalTitle">Thêm môn học</h2><input id="editId" type="hidden"><div class="form-grid"><div><label for="subject">Môn học</label><input id="subject" required placeholder="Ví dụ: Toán"></div><div><label for="room">Phòng học</label><input id="room" placeholder="Ví dụ: A203"></div></div><label for="note">Ghi chú</label><textarea id="note" placeholder="Bài tập, giảng viên hoặc nhắc nhở…"></textarea><label for="scheduleType">Loại lịch</label><select id="scheduleType"><option value="weekly">Lặp lại hàng tuần</option><option value="makeup">Dạy bù một ngày</option></select><div class="form-grid"><div id="dayField"><label for="day">Thứ</label><select id="day"></select></div><div id="dateField" hidden><label for="makeupDate">Ngày dạy bù</label><input id="makeupDate" type="date"></div><div><label for="slot">Khung giờ</label><select id="slot"></select></div></div><label for="color">Màu hiển thị</label><input id="color" type="color" value="#b9c8ff"><p class="hint">Nhấn vào môn đã có để chỉnh sửa.</p><div class="form-actions"><button value="cancel" class="secondary">Hủy</button><button id="deleteSubject" type="button" class="danger" hidden>Xóa môn</button><button id="save" value="default">Lưu</button></div></form></dialog>
  <script>
    const days=['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ Nhật'];
    const sample={rows:['07:00 – 08:30','08:45 – 10:15','13:00 – 14:30','14:45 – 16:15'],items:[{id:1,day:0,slot:0,subject:'Toán học',room:'A203',note:'Ôn chương 2',color:'#b9c8ff'},{id:2,day:2,slot:1,subject:'Tiếng Anh',room:'B105',note:'Thuyết trình nhóm',color:'#bdf0d0'},{id:3,day:4,slot:2,subject:'Lập trình Web',room:'Lab 3',note:'Mang máy tính',color:'#ffd9a8'}],makeups:[]};
    let data=JSON.parse(localStorage.getItem('timetable-v2')||'null')||structuredClone(sample), active=null, activeType='weekly';
    if(!Array.isArray(data.makeups))data.makeups=[];
    const $=s=>document.querySelector(s), schedule=$('#schedule'), dialog=$('#editor'), weekPicker=$('#weekPicker');
    function save(){localStorage.setItem('timetable-v2',JSON.stringify(data))}
    function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function dateValue(date){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-')}
    function formatDate(value){const [year,month,day]=value.split('-');return day+'/'+month+'/'+year}
    function currentWeekDates(){const date=new Date(weekPicker.value+'T00:00:00');date.setDate(date.getDate()-((date.getDay()+6)%7));return Array.from({length:7},(_,index)=>{const day=new Date(date);day.setDate(date.getDate()+index);return dateValue(day)})}
    function render(){const dates=currentWeekDates();dates.forEach((date,day)=>{$('#day-'+day).innerHTML=days[day]+'<br><small>'+formatDate(date)+'</small>'});schedule.innerHTML=data.rows.map((time,slot)=>'<tr><td><input class="time-input" aria-label="Thời gian hàng '+(slot+1)+'" value="'+esc(time)+'" data-slot="'+slot+'"></td>'+days.map((_,day)=>{const date=dates[day],makeup=data.makeups.find(item=>item.date===date&&item.slot===slot),item=makeup||data.items.find(entry=>entry.day===day&&entry.slot===slot),type=makeup?'makeup':'weekly';return '<td>'+(item?'<article class="cell" data-id="'+item.id+'" data-type="'+type+'" style="background:'+esc(item.color)+'"><button class="delete" title="Xóa">×</button>'+(makeup?'<small class="occurrence">Dạy bù · '+formatDate(date)+'</small>':'')+'<strong>'+esc(item.subject)+'</strong>'+(item.room?'<small>📍 '+esc(item.room)+'</small>':'')+(item.note?'<small>'+esc(item.note)+'</small>':'')+'</article>':'<article class="cell empty" data-day="'+day+'" data-date="'+date+'" data-slot="'+slot+'">＋</article>')+'</td>'}).join('')+'</tr>').join('');save()}
    function options(){$('#day').innerHTML=days.map((day,index)=>'<option value="'+index+'">'+day+'</option>').join('');$('#slot').innerHTML=data.rows.map((time,index)=>'<option value="'+index+'">'+esc(time||'Khung giờ '+(index+1))+'</option>').join('')}
    function syncEditorType(){$('#dayField').hidden=$('#scheduleType').value==='makeup';$('#dateField').hidden=$('#scheduleType').value!=='makeup'}
    function openEditor(item={},type='weekly',defaults={}){options();active=item.id||null;activeType=type;$('#modalTitle').textContent=active?'Chỉnh sửa môn học':type==='makeup'?'Thêm ngày dạy bù':'Thêm môn học';$('#editId').value=active||'';$('#subject').value=item.subject||'';$('#room').value=item.room||'';$('#note').value=item.note||'';$('#scheduleType').value=type;$('#day').value=item.day??defaults.day??0;$('#makeupDate').value=item.date||defaults.date||weekPicker.value;$('#slot').value=item.slot??defaults.slot??0;$('#color').value=item.color||'#b9c8ff';$('#deleteSubject').hidden=!active;syncEditorType();dialog.showModal();$('#subject').focus()}
    weekPicker.value=dateValue(new Date());
    schedule.addEventListener('input',e=>{if(e.target.matches('.time-input')){data.rows[+e.target.dataset.slot]=e.target.value;save();options()}});
    schedule.addEventListener('click',e=>{const del=e.target.closest('.delete');if(del){e.stopPropagation();const cell=del.closest('.cell'),collection=cell.dataset.type==='makeup'?'makeups':'items';data[collection]=data[collection].filter(item=>item.id!==+cell.dataset.id);render();return}const cell=e.target.closest('.cell');if(!cell)return;if(cell.classList.contains('empty')){openEditor({},'weekly',{day:+cell.dataset.day,date:cell.dataset.date,slot:+cell.dataset.slot});return}const type=cell.dataset.type,collection=type==='makeup'?data.makeups:data.items,item=collection.find(entry=>entry.id===+cell.dataset.id);openEditor(item,type)});
    $('#scheduleType').addEventListener('change',syncEditorType);weekPicker.addEventListener('change',render);$('#prevWeek').onclick=()=>{const date=new Date(weekPicker.value+'T00:00:00');date.setDate(date.getDate()-7);weekPicker.value=dateValue(date);render()};$('#nextWeek').onclick=()=>{const date=new Date(weekPicker.value+'T00:00:00');date.setDate(date.getDate()+7);weekPicker.value=dateValue(date);render()};
    $('#addSubject').onclick=()=>openEditor();$('#addMakeup').onclick=()=>openEditor({},'makeup');$('#addRow').onclick=()=>{data.rows.push('Thời gian mới');render()};$('#print').onclick=()=>window.print();$('#reset').onclick=()=>{if(confirm('Khôi phục dữ liệu mẫu? Dữ liệu hiện tại sẽ bị thay thế.')){data=structuredClone(sample);render()}};
    $('#deleteSubject').onclick=()=>{const collection=activeType==='makeup'?'makeups':'items';data[collection]=data[collection].filter(item=>item.id!==active);dialog.close();render()};
    dialog.querySelector('form').addEventListener('submit',e=>{if(e.submitter?.value==='cancel')return;const type=$('#scheduleType').value,slot=+$('#slot').value,item={id:active||Date.now(),subject:$('#subject').value.trim(),room:$('#room').value.trim(),note:$('#note').value.trim(),slot,color:$('#color').value};if(type==='makeup')item.date=$('#makeupDate').value;else item.day=+$('#day').value;if(!item.subject||(type==='makeup'&&!item.date)){e.preventDefault();return}data.items=data.items.filter(entry=>entry.id!==item.id);data.makeups=data.makeups.filter(entry=>entry.id!==item.id);const collection=type==='makeup'?'makeups':'items';data[collection]=data[collection].filter(entry=>!(type==='makeup'?entry.date===item.date&&entry.slot===item.slot:entry.day===item.day&&entry.slot===item.slot));data[collection].push(item);render()});render();
  </script>
</body>
</html>
